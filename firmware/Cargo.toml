[package]
edition = "2024"
name = "feestje-firmware"
version = "0.1.0"

[[bin]]
name = "feestje-firmware"
path = "src/main.rs"
test = false
doctest = false
bench = false

[features]
default = ["log"]
log = ["dep:esp-println"]

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32c6", "unstable"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6"] }

critical-section = "1.2.0"
esp-println = { version = "0.18.0", features = [
    "esp32c6",
    "log-04",
], optional = true }
embedded-graphics = "0.8.2"
esp-hub75 = { version = "0.17.0", features = ["esp32c6"] }
static_cell = "2.1.1"
log = { version = "0.4.34" }
heapless = "0.9.3"
hex = { version = "0.4.3", default-features = false }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32c6"] }
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embedded-io-async = "0.7.0"
embedded-hal-async = "1.0.0"
feestje-protocol = { path = "../protocol" }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
strip = true
lto = true
opt-level = 's'
